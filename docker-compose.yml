services:
  decolonize-time:
    container_name: decolonize-time
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    labels:
    - traefik.enable=true
    - traefik.http.routers.decolonize-time.rule=Host(`decolonizeti.me`) || Host(`www.decolonizeti.me`)
    - traefik.http.services.decolonize-time.loadbalancer.server.port=3000
    networks:
    - traefik-public
    image: localhost:3000/jeffemmett/decolonize-time-website:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  traefik-public:
    external: true
